services:
  postgres:
    image: postgres:16-alpine
    container_name: edusports-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edusports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edusports_pass}
      POSTGRES_DB: ${POSTGRES_DB:-edusports}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - edusports_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edusports} -d ${POSTGRES_DB:-edusports}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    container_name: edusports-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3100
      DATABASE_URL: postgresql://${POSTGRES_USER:-edusports}:${POSTGRES_PASSWORD:-edusports_pass}@postgres:5432/${POSTGRES_DB:-edusports}
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  edusports_pgdata:
